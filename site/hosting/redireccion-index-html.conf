# Insertar despues de RewriteEngine On y antes del bloque "Dominio canónico" en el .htaccess vigente.
# /index.html → / y /<carpeta>/index.html → /<carpeta>/ (301). THE_REQUEST mira la URL que pidió
# el visitante, así no choca con DirectoryIndex, que sirve index.html internamente.
RewriteCond %{THE_REQUEST} \s/+(\S*/)?index\.html[\s?] [NC]
RewriteRule ^(.*/)?index\.html$ https://webfriends.cl/$1 [R=301,L]
