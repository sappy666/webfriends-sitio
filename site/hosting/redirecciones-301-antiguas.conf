# Insertar despues de RewriteEngine On en el .htaccess vigente.
# Conservar las directivas PHP y las demas reglas del servidor.
RewriteRule ^plataformas-web/?$ /sitios-web/ [R=301,L]
RewriteRule ^plataformas-web/soluciones-industrias/?$ /servicios/ [R=301,L]
RewriteRule ^agendar-consulta/?$ /contacto/ [R=301,L]
RewriteRule ^politica-de-privacidad/?$ /terminos/ [R=301,L]
