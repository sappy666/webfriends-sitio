    heading: Señales de que tu producto necesita UX
    cards:
      - title: Los usuarios preguntan lo obvio
        description: "Si tu equipo de soporte responde siempre lo mismo, la interfaz no está comunicando bien."
        chips: []
      - title: Abandono en el último paso
        description: "Formularios largos, pasos innecesarios o falta de confianza en el momento de convertir."
        chips: []
