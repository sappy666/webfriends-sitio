        description: "Sin sistema de diseño, el producto crece con parches y pierde coherencia."
        chips: []
      - title: Nadie sabe qué mide el éxito
        description: "Diseñar sin una métrica objetivo lleva a discusiones de gusto personal en vez de decisiones."
