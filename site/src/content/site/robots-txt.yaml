# robots.txt (src/pages/robots.txt.ts agrega la línea Sitemap al final).
# Los permisos de búsqueda y los de entrenamiento son decisiones distintas: bloquear un agente de
# entrenamiento no saca al sitio de los buscadores ni de las respuestas de los asistentes de IA.
rules: |
  # Webfriends Chile — https://webfriends.cl
  # Todo el sitio es público e indexable. Las páginas que no deben indexarse llevan
  # <meta name="robots" content="noindex"> y no aparecen en el sitemap.

  User-agent: *
  # Voluntary usage preferences for compatible crawlers.
  Content-Signal: search=yes, ai-input=yes, ai-train=no
  # Restos del WordPress antiguo: no existen y ya devuelven 404. Se bloquean solo
  # para que los rastreadores dejen de pedirlas; esto NO las desindexa.
  # Van ANTES de "Allow: /" a proposito: Google aplica la regla mas especifica,
  # pero otros rastreadores aplican la primera que calza. Asi ambos coinciden.
  # Ojo: NO bloquear /casos/ ni /robots-txt/, que redirigen 301 a su pagina nueva.
  # Sin lineas en blanco dentro del grupo: cortan el registro y lo invalidan.
  Disallow: /wp-admin/
  Disallow: /wp-content/
  Disallow: /wp-includes/
  Disallow: /wp-json/
  Disallow: /wp-login.php
  Disallow: /xmlrpc.php
  Allow: /

  # --- Bots de CITACIÓN / búsqueda de IA: PERMITIDOS ---
  User-agent: OAI-SearchBot
  Allow: /

  User-agent: ChatGPT-User
  Allow: /

  User-agent: Claude-SearchBot
  Allow: /

  User-agent: Claude-User
  Allow: /

  User-agent: PerplexityBot
  Allow: /

  User-agent: Perplexity-User
  Allow: /

  User-agent: GoogleOther
  Allow: /

  User-agent: Google-Extended
  Allow: /

  # --- Bots de ENTRENAMIENTO: coherentes con ai-train=no ---
  User-agent: GPTBot
  Disallow: /

  User-agent: ClaudeBot
  Disallow: /

  User-agent: Applebot-Extended
  Disallow: /
