content: |
  # Webfriends Chile

  > Agencia de marketing digital, desarrollo web y diseño UX/UI en Chile, con foco en SEO, Google Ads y sitios web para el sector salud.

  ## Servicios
  - [SEO](/seo): Posicionamiento orgánico en buscadores.
  - [Google Ads](/google-ads): Campañas de pago por clic.
  - [Sitios web](/sitios-web): Desarrollo de sitios y tiendas online.
  - [UX/UI](/ux-ui): Diseño de producto y experiencia de usuario.
  - [Salud](/salud): Soluciones web específicas para clínicas y centros de salud.

  ## Otras páginas
  - [Casos de éxito](/casos): Proyectos entregados a clientes.
  - [Nosotros](/nosotros): Sobre la agencia.
  - [Contacto](/contacto): Formulario y datos de contacto.
  - [Blog](/blog): Artículos sobre SEO, Ads, desarrollo web y UX/UI.
