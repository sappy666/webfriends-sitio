  # Webfriends Chile

  > Agencia chilena de marketing digital fundada en 2019: Google Ads, SEO y GEO (posicionamiento en buscadores y en respuestas de IA), desarrollo de sitios y tiendas web, plataformas para centros de salud y diseño UX/UI. Google Partner con precios publicados en pesos chilenos.

  - Más de $500M gestionados en campañas publicitarias (2019–2026), más de 150 plataformas desarrolladas y más de 500 clientes en Chile y Latinoamérica.
  - Google Partner desde hace 7 años. Calificación 4,4 de 5 en Google (18 reseñas).
  - Trabajo 100% remoto para todo Chile. Oficinas: Etchevers 210, Viña del Mar, y Av. Kennedy 7440, of. 701, Vitacura (Santiago).
  - Contacto: contacto@webfriends.cl · +56 9 3197 1436 (también WhatsApp).
  - Los precios de los planes son en pesos chilenos (CLP); los planes mensuales se informan + IVA.
