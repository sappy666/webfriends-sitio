content: |
  # Webfriends Chile

  > Agencia chilena de marketing digital fundada en 2019 que trabaja con empresas de todo Chile (domicilio legal en Viña del Mar): Google Ads, SEO y GEO (posicionamiento en buscadores y en respuestas de IA), desarrollo de sitios y tiendas web, plataformas para centros de salud y diseño UX/UI. Google Partner con precios publicados en pesos chilenos.

  - Más de $500M gestionados en campañas publicitarias (2019–2026), más de 150 plataformas desarrolladas y más de 500 clientes en Chile y Latinoamérica.
  - Google Partner desde hace 7 años. Calificación 4,4 de 5 en Google (18 reseñas).
  - Trabajo 100% en línea para empresas de todo Chile (videollamada, correo y WhatsApp). No hay atención presencial.
  - Contacto: contacto@webfriends.cl · +56 9 3197 1436 (también WhatsApp). Lunes a viernes, 9:00 a 18:30 (hora de Chile). Respuesta en menos de 24 horas hábiles.
  - Perfiles oficiales: https://www.linkedin.com/company/webfriends-chile · https://www.instagram.com/webfriendschile/ · https://www.behance.net/webfriendscl
  - Los precios de los planes son en pesos chilenos (CLP); los planes mensuales se informan + IVA.
