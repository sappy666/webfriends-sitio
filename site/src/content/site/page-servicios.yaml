    heading: Elige por dónde empezar
    cards:
      - title: Google Ads
        description: "Campañas en Google para aparecer justo cuando te buscan. Gestión del 30% de la inversión hasta $1.000.000 y tarifa fija por tramo sobre ese monto, cuentas a tu nombre y reporte mensual."
        chips: [Búsqueda, Display y remarketing, Seguimiento de conversiones]
