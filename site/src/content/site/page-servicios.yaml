    steps: []
  - id: integral-h
    eyebrow: Estrategia integral
    heading: Por qué conviene combinarlos
    cards:
      - title: Un solo equipo
        description: "Quien hace tus anuncios conoce tu sitio y tu SEO. No hay que coordinar tres agencias ni repetir el mismo brief."
        chips: []
      - title: Datos que se cruzan
        description: "Lo que aprendemos en Google Ads sobre qué búsquedas convierten alimenta el contenido SEO, y al revés."
        chips: []
      - title: Resultados ahora y a largo plazo
        description: "Los anuncios traen contactos desde el primer mes mientras el SEO construye tráfico que no depende del presupuesto."
        chips: []
    steps: []
  - id: elegir-h
    eyebrow: Por dónde empezar
    heading: Qué servicio conviene según tu situación
    cards:
      - title: Aún no tienes sitio o el actual no convierte
        description: "Parte por el sitio web. Los anuncios y el SEO traen visitas, pero es el sitio el que las convierte en contactos o ventas: si carga lento o no explica bien tu oferta, todo lo que inviertas después rinde menos."
        chips: []
      - title: Necesitas contactos este mes
        description: "Google Ads es el canal más rápido. Tus anuncios aparecen cuando alguien busca lo que vendes, y con el seguimiento de conversiones sabes cuántas consultas trae cada campaña desde el primer mes."
        chips: []
      - title: Quieres depender menos de la publicidad
        description: "El SEO y el GEO construyen tráfico orgánico que sigue llegando aunque pauses el presupuesto, y te ayudan a aparecer en las respuestas de los asistentes de IA. Toma meses, por eso conviene empezar antes de necesitarlo."
        chips: []
      - title: Tienes un centro médico o dental
        description: "Las plataformas para salud suman agenda online, fichas de especialistas, convenios y posicionamiento local por sede, para que los pacientes encuentren tu centro y reserven sin llamar."
        chips: []
      - title: Tu producto digital ya tiene usuarios
        description: "El diseño UX/UI parte con una auditoría y pruebas con usuarios para encontrar dónde se traban, antes de gastar presupuesto en rediseñar pantallas por intuición."
        chips: []
    steps: []
