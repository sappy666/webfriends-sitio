      - title: Sitios y tiendas web
        description: "Sitios rápidos, fáciles de administrar y pensados para convertir visitas en contactos o ventas."
        chips: [Sitios corporativos, E-commerce, Landing pages]
      - title: Plataformas para salud
        description: "Sitios y agenda online para centros médicos y dentales, con posicionamiento local por sede."
        chips: [Agenda online, Multisede, Google Mi Negocio]
      - title: Diseño UX/UI
        description: "Investigación, arquitectura y diseño de interfaces para productos digitales que la gente entiende y usa."
