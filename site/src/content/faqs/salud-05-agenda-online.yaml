question: ¿Mis pacientes pueden agendar hora online desde el sitio?
category: salud
order: 5
answer: "Sí, en los planes que la incluyen: Centro con Reservas y Red Multisede traen agenda en línea visible desde el celular, que puede conectarse con el sistema que ya usan si este lo permite. El plan Centro Único no la trae. Lo revisamos en la reunión inicial antes de comprometer nada."
