question: ¿Cuál es la diferencia entre UX y UI?
category: uxui
order: 5
answer: "UX es cómo funciona la experiencia: que la persona encuentre lo que busca y complete su objetivo sin trabas. UI es cómo se ve: colores, tipografía y componentes. Trabajamos ambas porque una interfaz bonita que no se entiende no convierte."
